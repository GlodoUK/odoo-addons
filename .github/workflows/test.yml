name: tests

on:
  pull_request:
    branches:
      - "17.0*"
  push:
    branches:
      - "17.0"

env:
  UV_NO_CACHE: true
  UV_PYTHON_DOWNLOADS: never
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  DEBIAN_FRONTEND: noninteractive
  UV_INDEX_URLL:

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v3
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
    name: Test
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    env:
      PGHOST: odoo
      PGPASSWORD: odoo
      PGDATABASE: odoo
    steps:
      - name: Apt update and dependencies
        run: |
          apt-get -yqq update
          apt-get install -yqq --no-install-recommends \
            expect \
            build-essential \
            git \
            libpq-dev \
            libldap2-dev \
            libsasl2-dev \
            libxml2-dev \
            libxslt-dev

      - uses: actions/checkout@v4
        with:
          repository: "odoo/odoo"
          ref: "17.0"
          persist-credentials: false
          path: odoo

      - uses: actions/checkout@v4
        with:
          repository: "GlodoUK/enterprise"
          ref: "17.0"
          persist-credentials: false
          path: enterprise
          token: ${{ secrets.GLODOUK_ENTERPRISE_GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: odoo-addons

      - name: Bootstrap venv
        run: |
          uv venv && \
            uv pip install -r odoo/requirements.txt && \
            uv pip install -e odoo && \
            uv pip install -r odoo-addons/requirements.txt && \
            uv pip install \
              pyproject-dependencies \
              click-odoo-contrib \
              manifestoo \
              checklog-odoo \
              coverage

        # Symlink workaround for:
        # - https://github.com/astral-sh/uv/issues/2744
        # - https://github.com/pypa/setuptools/issues/4863
      - name: Overwriting odoo-bin in venv as workaround for pypa/setuptools/issues/4863
        run: |
          ln -sf ${GITHUB_WORKSPACE}/odoo/odoo-bin ${GITHUB_WORKSPACE}/.venv/bin/odoo

      - name: Install any extra python dependencies
        run: |
          deps=$(uv run -- pyproject-dependencies odoo-addons/*/pyproject.toml odoo-addons/setup/*/setup.py)
          if [ -n "$deps" ]; then
              uv pip install ${deps}
          fi

      - name: Install any extra apt dependencies
        run: |
          deps=$(uv run -- manifestoo -d odoo-addons list-external-dependencies deb --transitive)
          if [ -n "$deps" ]; then
              apt-get install -yqq --no-install-recommends ${deps}
          fi

      - name: Setup odoo.conf
        run: |
          echo "[options]" > odoo.conf
          echo "addons_path=odoo/addons,enterprise,odoo-addons" >> odoo.conf

      - name: Init database
        env:
          ODOO_RC: odoo.conf
        run: |
          uv run -- click-odoo-initdb --no-cache -n $PGDATABASE

      - name: Run tests
        env:
          ODOO_RC: odoo.conf
        run: |
          unbuffer uv run -- coverage run --include "odoo-addons/*" --branch \
              .venv/bin/odoo \
              -i $(uv run -- manifestoo --select-addons-dir odoo-addons list --separator=, --sort topological) \
              --test-enable \
              --stop-after-init | uv run -- checklog-odoo
