name: test

on:
  pull_request:
    branches:
      - "19.0*"
  push:
    branches:
      - "19.0"

env:
  # "Rebel" modules: addons that must be tested in isolation. Comma separated.
  # Each gets its own database/run and is excluded from the main run.
  # To add one, append its technical name to the list, e.g. "foo,bar".
  REBEL_MODULES: ""

jobs:
  pre-commit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oca-gen-addon-readme
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Build test matrix from rebel list
        id: set
        run: |
          # Strip whitespace from the comma-separated rebel list.
          rebels="$(echo "$REBEL_MODULES" | tr -d '[:space:]')"

          # The "main" run is everything except the rebels. Each rebel then
          # gets its own run selecting only itself. Every entry carries an
          # explicit manifestoo select flag.
          if [ -n "$rebels" ] ; then
              main_select="--select-exclude $rebels"
          else
              main_select=""
          fi
          include="$(jq -cn --arg s "$main_select" '[{"name":"main","select":$s}]')"
          for module in ${rebels//,/ } ; do
              include="$(jq -c --arg m "$module" \
                '. + [{"name":$m,"select":("--select-include " + $m)}]' <<<"$include")"
          done

          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect unreleased dependencies
        run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done

      - name: Build CI image
        env:
          GITHUB_TOKEN: ${{ secrets.GLODOUK_ENTERPRISE_GITHUB_TOKEN }}
        run: |
          docker compose -f .ci/docker-compose.yaml build --build-arg GITHUB_TOKEN="$GITHUB_TOKEN"

      - name: Run CI
        env:
          MANIFESTOO_SELECT: ${{ matrix.select }}
        run: |
          docker compose -f .ci/docker-compose.yaml up --quiet-pull --exit-code-from odoo
